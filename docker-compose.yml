# Lokale Entwicklungs-Datenbank (Phase C-lokal) — Postgres 16.
# ----------------------------------------------------------------------------
# Reproduzierbarer Team-Weg (Alternative zum nativen brew-Postgres). Die
# Zugangsdaten sind DEV-ONLY und NICHT geheim (nur lokal). Eingespielt wird
# dieselbe kanonische Migration wie in Produktion — der spätere Wechsel auf
# hosted Supabase ist nur ein Connection-String-Wechsel (+ Auth/Storage).
#
# Nutzung:
#   docker compose up -d              # DB starten
#   # .env.development.local: TOOLING_DATABASE_URL/Owner = fahrschul_owner (s. u.)
#   npm run db:setup                  # Migration + app_user-Login + Seed
#   npm run dev
services:
  db:
    image: postgres:16
    container_name: fahrschul-db
    environment:
      POSTGRES_USER: fahrschul_owner
      POSTGRES_PASSWORD: devlocal_owner
      POSTGRES_DB: fahrschul_dev
    ports:
      - "5432:5432"
    volumes:
      - fahrschul_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahrschul_owner -d fahrschul_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fahrschul_pgdata:
